name: CI

on:
  push:
    branches: [master, 'hyprland-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hyprland comes from the pinned nixpkgs (nix/pkgs.nix), prebuilt on cache.nixos.org. CI never compiles it:
# when the cache lacks the pinned build, the first step fails instead of compiling for an hour.
# GitHub's runners are too small for the VM tests; they run locally with ./dev.sh vm-test and vm-demo-screenshot.
# CI only evaluates them.
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Fetch Hyprland from the binary cache
        # --max-jobs 0 forbids local builds: everything has to be substituted.
        run: |
          nix build .#hyprland .#xdg-desktop-portal-hyprland --max-jobs 0 --no-link --print-build-logs || {
            echo "::error::The pinned nixpkgs has no prebuilt Hyprland on cache.nixos.org. Pin a nixpkgs revision that does."
            exit 1
          }
      - name: Build plugin
        run: nix build .#hyprtrizone --print-build-logs
      - name: Evaluate the VM tests
        run: |
          nix eval --raw .#checks.x86_64-linux.vm-test.drvPath
          nix eval --raw .#checks.x86_64-linux.demo.drvPath
