name: CI

on:
  push:
    branches: [master, 'hyprland-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Hyprland comes from its own flake at the pinned commit (nix/pkgs.nix), prebuilt on hyprland.cachix.org. CI never
# compiles it: when the cache lacks the pinned build, the first step fails instead of compiling for an hour.
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      - name: Fetch Hyprland from the binary caches
        # --max-jobs 0 forbids local builds: everything has to be substituted.
        run: |
          nix build .#hyprland .#xdg-desktop-portal-hyprland --max-jobs 0 --no-link --print-build-logs || {
            echo "::error::The pinned Hyprland is not on hyprland.cachix.org. Pin a commit whose build Hyprland's CI published."
            exit 1
          }
      - name: Build plugin
        run: nix build .#hyprtrizone --print-build-logs
      - name: Layout integration
        run: nix build .#checks.x86_64-linux.vm-test --print-build-logs
      - name: Quickshell demo
        run: nix build .#checks.x86_64-linux.demo --print-build-logs
