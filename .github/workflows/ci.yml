name: CI

on:
  push:
    branches: [master, 'hyprland-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    # Hyprland comes from its own flake at the pinned tag. When hyprland.cachix.org lacks that release,
    # it is compiled once here and reused by both VM checks.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      - name: Build plugin
        run: nix build .#hyprtrizone --print-build-logs
      - name: Layout integration
        run: nix build .#checks.x86_64-linux.vm-test --print-build-logs
      - name: Quickshell demo
        run: nix build .#checks.x86_64-linux.demo --print-build-logs
